<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zubapin — O'yin donati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E1A;
    --surface:#131731;
    --surface-2:#1B2044;
    --border:#2A2F58;
    --accent:#FFB020;
    --accent-2:#7C5CFC;
    --text:#E8E9F3;
    --muted:#8890B5;
    --success:#3FC98A;
    --danger:#FF6B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  ::selection{background:var(--accent); color:#1A1200;}

  /* Layout */
  .app{max-width:1100px; margin:0 auto; padding:0 20px 80px;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:rgba(11,14,26,0.92); backdrop-filter:blur(8px); z-index:50;
  }
  .logo{display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px;}
  .logo-gem{
    width:26px;height:26px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    clip-path:polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
  }
  nav{display:flex; gap:6px; align-items:center;}
  .nav-btn{
    padding:8px 16px; border-radius:8px; color:var(--muted); font-weight:500; font-size:14px;
    transition:all .15s;
  }
  .nav-btn:hover, .nav-btn.active{background:var(--surface-2); color:var(--text);}
  .cart-btn{
    position:relative; display:flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:8px; background:var(--surface-2); color:var(--text); font-weight:600; font-size:14px;
  }
  .cart-count{
    background:var(--accent); color:#1A1200; font-size:11px; font-weight:700;
    padding:1px 6px; border-radius:10px;
  }

  /* Hero */
  .hero{padding:64px 0 40px; text-align:center;}
  .eyebrow{
    display:inline-block; font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin-bottom:14px;
  }
  .hero h1{font-size:44px; line-height:1.15; margin-bottom:16px;}
  .hero h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p{color:var(--muted); font-size:16px; max-width:520px; margin:0 auto;}

  /* Game grid */
  .section-title{font-size:22px; margin:44px 0 20px; display:flex; align-items:center; gap:10px;}
  .game-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px;}
  .game-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:22px; cursor:pointer; transition:transform .15s, border-color .15s;
    position:relative; overflow:hidden;
  }
  .game-card:hover{transform:translateY(-3px); border-color:var(--accent-2);}
  .game-card .icon{
    width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:24px; margin-bottom:16px;
    background:linear-gradient(135deg,var(--accent-2),var(--surface-2));
  }
  .game-card h3{font-size:17px; margin-bottom:4px;}
  .game-card p{color:var(--muted); font-size:13px;}

  /* Package (diamond) cards */
  .pkg-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; margin-top:20px;}
  .pkg-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px 14px; text-align:center; cursor:pointer; transition:.15s;
  }
  .pkg-card:hover{border-color:var(--accent);}
  .pkg-card.selected{border-color:var(--accent); background:var(--surface-2); box-shadow:0 0 0 1px var(--accent);}
  .pkg-gem{
    width:34px; height:34px; margin:0 auto 10px;
    background:linear-gradient(135deg,var(--accent),#FFD98A);
    clip-path:polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
  }
  .pkg-amount{font-weight:700; font-size:16px; font-family:'Space Grotesk',sans-serif;}
  .pkg-price{color:var(--muted); font-size:13px; margin-top:4px;}

  /* Forms */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500;}
  .field input, .field select{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14px; font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
  .btn{
    padding:13px 24px; border-radius:10px; font-weight:600; font-size:14px;
    background:linear-gradient(135deg,var(--accent),#E89A10); color:#1A1200;
    transition:opacity .15s;
  }
  .btn:hover{opacity:.9;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:var(--danger); color:#2A0505;}
  .btn-sm{padding:8px 14px; font-size:13px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:14px; margin-bottom:20px;}
  .back-link:hover{color:var(--text);}

  .summary-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .summary-row:last-child{border:none; font-weight:700; font-size:16px; padding-top:16px;}

  .status-badge{
    display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600;
  }
  .status-kutilmoqda{background:rgba(255,176,32,.15); color:var(--accent);}
  .status-tolandi{background:rgba(124,92,252,.15); color:var(--accent-2);}
  .status-bajarildi{background:rgba(63,201,138,.15); color:var(--success);}
  .status-bekor{background:rgba(255,107,107,.15); color:var(--danger);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--muted); font-weight:500; padding:10px 12px; border-bottom:1px solid var(--border);}
  td{padding:12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:hover td{background:var(--surface-2);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto;}

  .empty{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty .icon{font-size:36px; margin-bottom:12px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--accent); padding:12px 22px; border-radius:10px;
    font-size:14px; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .copy-code{
    background:var(--surface-2); border:1px dashed var(--border); border-radius:8px; padding:10px 14px;
    display:flex; justify-content:space-between; align-items:center; font-family:monospace; font-size:14px; margin-top:6px;
  }

  footer{text-align:center; color:var(--muted); font-size:12px; padding-top:60px;}

  @media(max-width:640px){
    .hero h1{font-size:30px;}
    header{flex-wrap:wrap; gap:12px;}
    nav{width:100%; justify-content:space-between;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" class="toast"></div>

<script>
// ---------- Data ----------
const DEFAULT_GAMES = [
  {id:'mlbb', name:'Mobile Legends: Bang Bang', icon:'⚔️', tagline:'Diamond to\'ldirish', currency:'Diamond',
    fields:[{key:'uid',label:'User ID'},{key:'server',label:'Server ID (zone)'}],
    packages:[
      {id:'m1', amount:'Haftalik elit pack', price:10500},
      {id:'m2', amount:'Oylik elit pack', price:51000},
      {id:'m3', amount:'Almaz propusk', price:18266},
      {id:'m4', amount:'50+5 (+45 birinchi harid)', price:9170},
      {id:'m5', amount:'150+15 (+135 birinchi harid)', price:27498},
      {id:'m6', amount:'250+25 (+225 birinchi harid)', price:44103},
      {id:'m7', amount:'500+65 (+435 birinchi harid)', price:90597},
      {id:'m8', amount:'172 (156+16)', price:28693},
      {id:'m9', amount:'257 (234+23)', price:41845},
      {id:'m10', amount:'706 (625+81)', price:115005},
      {id:'m11', amount:'2195 (1860+335)', price:347992},
      {id:'m12', amount:'3688 (3099+589)', price:580437},
      {id:'m13', amount:'5532 (4649+883)', price:876744},
      {id:'m14', amount:'9288 (7740+1548)', price:1455828},
    ]},
  {id:'freefire', name:'Free Fire', icon:'🔥', tagline:'Diamond to\'ldirish', currency:'Diamond',
    fields:[{key:'uid',label:'Player ID (UID)'}],
    packages:[
      {id:'f1', amount:'100 Diamond', price:15000},
      {id:'f2', amount:'210 Diamond', price:30000},
      {id:'f3', amount:'520 Diamond', price:72000},
      {id:'f4', amount:'1080 Diamond', price:145000},
      {id:'f5', amount:'2200 Diamond', price:290000},
    ]},
  {id:'pubgm', name:'PUBG Mobile', icon:'🎯', tagline:'UC to\'ldirish', currency:'UC',
    fields:[{key:'uid',label:'Character ID'}],
    packages:[
      {id:'p1', amount:'60 UC', price:14000},
      {id:'p2', amount:'325 UC', price:68000},
      {id:'p3', amount:'660 UC', price:135000},
      {id:'p4', amount:'1800 UC', price:340000},
    ]},
];

const PAYMENT_CARD = {number:'8600 1234 5678 9012', holder:'ZUBAPIN MCHJ / Ism Familiya'};
const ADMIN_PASSWORD = 'admin123'; // Demo uchun — real loyihada backendda saqlanadi

// ---------- Storage helpers (persistent, shared across all visitors) ----------
async function getGames(){
  try{
    const r = await window.storage.get('games', true);
    return r ? JSON.parse(r.value) : DEFAULT_GAMES;
  }catch(e){ return DEFAULT_GAMES; }
}
async function saveGames(games){
  await window.storage.set('games', JSON.stringify(games), true);
}
async function getOrders(){
  try{
    const r = await window.storage.get('orders', true);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveOrders(orders){
  await window.storage.set('orders', JSON.stringify(orders), true);
}
function genOrderId(){
  return 'GV' + Date.now().toString(36).toUpperCase().slice(-6) + Math.random().toString(36).slice(2,4).toUpperCase();
}
function fmtPrice(n){ return n.toLocaleString('ru-RU') + " so'm"; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- App State ----------
let state = {
  view: 'home', // home | game | checkout | track | admin-login | admin
  games: [],
  orders: [],
  currentGame: null,
  selectedPkg: null,
  fieldValues: {},
  isAdmin: false,
  lastOrderId: null,
};

async function init(){
  state.games = await getGames();
  state.orders = await getOrders();
  render();
}

function setView(v, extra={}){
  state = {...state, view:v, ...extra};
  render();
}

// ---------- Render ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = header() + body();
  attachHandlers();
}

function header(){
  return `
  <header>
    <div class="logo"><div class="logo-gem"></div> Zubapin</div>
    <nav>
      <a class="nav-btn ${state.view==='home'?'active':''}" data-nav="home">O'yinlar</a>
      <a class="nav-btn ${state.view==='track'?'active':''}" data-nav="track">Buyurtmani kuzatish</a>
      <a class="nav-btn ${state.view==='admin-login'||state.view==='admin'?'active':''}" data-nav="admin-login">Admin</a>
    </nav>
  </header>`;
}

function body(){
  switch(state.view){
    case 'home': return viewHome();
    case 'game': return viewGame();
    case 'checkout': return viewCheckout();
    case 'track': return viewTrack();
    case 'order-detail': return viewOrderDetail();
    case 'admin-login': return viewAdminLogin();
    case 'admin': return viewAdmin();
    default: return viewHome();
  }
}

function viewHome(){
  return `
  <section class="hero">
    <span class="eyebrow">Tez • Ishonchli • 24/7</span>
    <h1>Sevimli o'yiningizga <span class="grad">bir zumda</span> donat qiling</h1>
    <p>Mobile Legends, Free Fire, PUBG Mobile — ID raqamingizni kiriting, paket tanlang, to'lang.</p>
  </section>
  <h2 class="section-title">🎮 O'yinni tanlang</h2>
  <div class="game-grid">
    ${state.games.map(g => `
      <div class="game-card" data-game="${g.id}">
        <div class="icon">${g.icon}</div>
        <h3>${g.name}</h3>
        <p>${g.tagline}</p>
      </div>`).join('')}
  </div>
  ${footer()}`;
}

function viewGame(){
  const g = state.currentGame;
  if(!g) return viewHome();
  return `
  <div style="padding-top:24px;">
    <a class="back-link" data-nav="home">← Orqaga</a>
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:8px;">
      <div class="icon" style="width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,var(--accent-2),var(--surface-2));">${g.icon}</div>
      <h1 style="font-size:26px;">${g.name}</h1>
    </div>
    <p style="color:var(--muted); margin-bottom:28px;">${g.tagline}</p>

    <div class="card">
      <h3 style="margin-bottom:16px;">1. Hisob ma'lumotlari</h3>
      ${g.fields.map(f => `
        <div class="field">
          <label>${f.label}</label>
          <input type="text" data-field="${f.key}" value="${state.fieldValues[f.key]||''}" placeholder="${f.label} kiriting">
        </div>`).join('')}
    </div>

    <h3 style="margin:28px 0 4px;">2. Paketni tanlang</h3>
    <div class="pkg-grid">
      ${g.packages.map(p => `
        <div class="pkg-card ${state.selectedPkg===p.id?'selected':''}" data-pkg="${p.id}">
          <div class="pkg-gem"></div>
          <div class="pkg-amount">${p.amount}</div>
          <div class="pkg-price">${fmtPrice(p.price)}</div>
        </div>`).join('')}
    </div>

    <div style="margin-top:28px; display:flex; justify-content:flex-end;">
      <button class="btn" id="toCheckout" ${state.selectedPkg?'':'disabled'}>Buyurtma berish →</button>
    </div>
  </div>
  ${footer()}`;
}

function viewCheckout(){
  const g = state.currentGame;
  const pkg = g.packages.find(p=>p.id===state.selectedPkg);
  const fieldsOk = g.fields.every(f => state.fieldValues[f.key]);
  return `
  <div style="padding-top:24px; max-width:520px; margin:0 auto;">
    <a class="back-link" data-nav="game">← Orqaga</a>
    <h1 style="font-size:24px; margin-bottom:20px;">Buyurtmani rasmiylashtirish</h1>

    <div class="card" style="margin-bottom:20px;">
      <div class="summary-row"><span>O'yin</span><span>${g.name}</span></div>
      ${g.fields.map(f=>`<div class="summary-row"><span>${f.label}</span><span>${state.fieldValues[f.key]||'—'}</span></div>`).join('')}
      <div class="summary-row"><span>Paket</span><span>${pkg.amount}</span></div>
      <div class="summary-row"><span>Jami to'lov</span><span>${fmtPrice(pkg.price)}</span></div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-bottom:12px;">To'lov ma'lumotlari</h3>
      <p style="color:var(--muted); font-size:13px; margin-bottom:10px;">Quyidagi kartaga aniq summani o'tkazing:</p>
      <div class="copy-code"><span>${PAYMENT_CARD.number}</span></div>
      <p style="color:var(--muted); font-size:13px; margin-top:10px;">Karta egasi: ${PAYMENT_CARD.holder}</p>
      <p style="color:var(--accent); font-size:13px; margin-top:14px;">⚠️ To'lovdan so'ng chek raqami yoki izoh kodini pastga kiriting — buyurtmangiz admin tomonidan qo'lda tekshiriladi va 5-30 daqiqa ichida tasdiqlanadi.</p>
    </div>

    <div class="card">
      <div class="field">
        <label>To'lov cheki / tranzaksiya raqami</label>
        <input type="text" id="receiptCode" placeholder="Masalan: 000123456789">
      </div>
      <div class="field">
        <label>Aloqa uchun Telegram username (ixtiyoriy)</label>
        <input type="text" id="contactTg" placeholder="@username">
      </div>
      <button class="btn" id="submitOrder" style="width:100%;" ${fieldsOk?'':'disabled'}>Buyurtmani tasdiqlash</button>
    </div>
  </div>
  ${footer()}`;
}

function viewTrack(){
  return `
  <div style="padding-top:24px; max-width:480px; margin:0 auto;">
    <h1 style="font-size:24px; margin-bottom:8px;">Buyurtmani kuzatish</h1>
    <p style="color:var(--muted); margin-bottom:20px; font-size:14px;">Buyurtma raqamingizni kiriting (masalan: GV4F2K9A)</p>
    <div class="card">
      <div class="field">
        <label>Buyurtma ID</label>
        <input type="text" id="trackId" placeholder="GV......">
      </div>
      <button class="btn" id="trackBtn" style="width:100%;">Qidirish</button>
    </div>
    <div id="trackResult" style="margin-top:20px;"></div>
  </div>
  ${footer()}`;
}

function orderRow(o){
  const statusMap = {kutilmoqda:'Kutilmoqda', tolandi:"To'landi", bajarildi:'Bajarildi', bekor:'Bekor qilindi'};
  const cls = {kutilmoqda:'status-kutilmoqda', tolandi:'status-tolandi', bajarildi:'status-bajarildi', bekor:'status-bekor'};
  return {label:statusMap[o.status]||o.status, cls:cls[o.status]||''};
}

function viewOrderDetail(){
  const o = state.orders.find(x=>x.orderId===state.lastOrderId);
  if(!o) return viewTrack();
  const s = orderRow(o);
  return `
  <div style="padding-top:24px; max-width:480px; margin:0 auto;">
    <a class="back-link" data-nav="track">← Orqaga</a>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="font-size:18px;">#${o.orderId}</h2>
        <span class="status-badge ${s.cls}">${s.label}</span>
      </div>
      <div class="summary-row"><span>O'yin</span><span>${o.gameName}</span></div>
      <div class="summary-row"><span>Paket</span><span>${o.pkgAmount}</span></div>
      <div class="summary-row"><span>Narx</span><span>${fmtPrice(o.price)}</span></div>
      <div class="summary-row"><span>Sana</span><span>${new Date(o.createdAt).toLocaleString('uz-UZ')}</span></div>
    </div>
  </div>
  ${footer()}`;
}

function viewAdminLogin(){
  return `
  <div style="padding-top:60px; max-width:360px; margin:0 auto;">
    <h1 style="font-size:22px; margin-bottom:20px; text-align:center;">Admin kirish</h1>
    <div class="card">
      <div class="field">
        <label>Parol</label>
        <input type="password" id="adminPass" placeholder="Parolni kiriting">
      </div>
      <button class="btn" id="adminLoginBtn" style="width:100%;">Kirish</button>
      <p style="color:var(--muted); font-size:12px; margin-top:14px; text-align:center;">Demo parol: admin123</p>
    </div>
  </div>`;
}

function viewAdmin(){
  const pending = state.orders.filter(o=>o.status==='kutilmoqda').length;
  const totalRevenue = state.orders.filter(o=>o.status!=='bekor').reduce((s,o)=>s+o.price,0);
  return `
  <div style="padding-top:24px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 style="font-size:24px;">Admin panel</h1>
      <button class="btn btn-ghost btn-sm" id="adminLogout">Chiqish</button>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:32px;">
      <div class="card"><div style="color:var(--muted); font-size:13px;">Jami buyurtmalar</div><div style="font-size:24px; font-weight:700; margin-top:6px;">${state.orders.length}</div></div>
      <div class="card"><div style="color:var(--muted); font-size:13px;">Kutilayotgan</div><div style="font-size:24px; font-weight:700; margin-top:6px; color:var(--accent);">${pending}</div></div>
      <div class="card"><div style="color:var(--muted); font-size:13px;">Jami daromad</div><div style="font-size:20px; font-weight:700; margin-top:6px; color:var(--success);">${fmtPrice(totalRevenue)}</div></div>
    </div>

    <h3 style="margin-bottom:14px;">Buyurtmalar</h3>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>ID</th><th>O'yin</th><th>ID/Server</th><th>Paket</th><th>Narx</th><th>Chek</th><th>Holat</th><th></th></tr></thead>
        <tbody>
          ${state.orders.length===0 ? `<tr><td colspan="8" style="text-align:center; color:var(--muted); padding:30px;">Hozircha buyurtma yo'q</td></tr>` :
            state.orders.slice().reverse().map(o=>{
              const s = orderRow(o);
              return `<tr>
                <td>${o.orderId}</td>
                <td>${o.gameName}</td>
                <td>${Object.values(o.fieldValues).join(' / ')}</td>
                <td>${o.pkgAmount}</td>
                <td>${fmtPrice(o.price)}</td>
                <td>${o.receiptCode||'—'}</td>
                <td><span class="status-badge ${s.cls}">${s.label}</span></td>
                <td>
                  <select data-order="${o.orderId}" class="statusSelect" style="padding:6px 8px; border-radius:6px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); font-size:12px;">
                    <option value="kutilmoqda" ${o.status==='kutilmoqda'?'selected':''}>Kutilmoqda</option>
                    <option value="tolandi" ${o.status==='tolandi'?'selected':''}>To'landi</option>
                    <option value="bajarildi" ${o.status==='bajarildi'?'selected':''}>Bajarildi</option>
                    <option value="bekor" ${o.status==='bekor'?'selected':''}>Bekor qilindi</option>
                  </select>
                </td>
              </tr>`;
            }).join('')}
        </tbody>
      </table>
    </div>

    <h3 style="margin:32px 0 14px;">O'yinlar va paketlar</h3>
    ${state.games.map(g => `
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <strong>${g.icon} ${g.name}</strong>
          <button class="btn btn-ghost btn-sm addPkgBtn" data-game="${g.id}">+ Paket qo'shish</button>
        </div>
        <table>
          <thead><tr><th>Miqdor</th><th>Narx</th><th></th></tr></thead>
          <tbody>
            ${g.packages.map(p=>`
              <tr>
                <td>${p.amount}</td>
                <td>${fmtPrice(p.price)}</td>
                <td><button class="btn-danger btn-sm delPkgBtn" data-game="${g.id}" data-pkg="${p.id}" style="border-radius:6px;">O'chirish</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `).join('')}
  </div>
  ${footer()}`;
}

function footer(){
  return `<footer>Zubapin — demo prototip. Real loyihada to'lovlar Payme/Click orqali avtomatlashtiriladi.</footer>`;
}

// ---------- Event handling ----------
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const v = el.dataset.nav;
      if(v==='admin-login' && state.isAdmin){ setView('admin'); return; }
      if(v==='game'){ setView('game'); return; }
      setView(v, {selectedPkg:null});
    };
  });

  document.querySelectorAll('[data-game]').forEach(el=>{
    if(el.classList.contains('addPkgBtn') || el.classList.contains('delPkgBtn')) return;
    el.onclick = ()=>{
      const g = state.games.find(x=>x.id===el.dataset.game);
      setView('game', {currentGame:g, fieldValues:{}, selectedPkg:null});
    };
  });

  document.querySelectorAll('[data-field]').forEach(el=>{
    el.oninput = ()=>{ state.fieldValues[el.dataset.field] = el.value; };
  });

  document.querySelectorAll('[data-pkg]').forEach(el=>{
    el.onclick = ()=>{ state.selectedPkg = el.dataset.pkg; render(); };
  });

  const toCheckout = document.getElementById('toCheckout');
  if(toCheckout) toCheckout.onclick = ()=> setView('checkout');

  const submitOrder = document.getElementById('submitOrder');
  if(submitOrder) submitOrder.onclick = async ()=>{
    const receipt = document.getElementById('receiptCode').value.trim();
    if(!receipt){ toast("Chek raqamini kiriting"); return; }
    const contact = document.getElementById('contactTg').value.trim();
    const g = state.currentGame;
    const pkg = g.packages.find(p=>p.id===state.selectedPkg);
    const order = {
      orderId: genOrderId(),
      gameId: g.id, gameName: g.name,
      fieldValues: {...state.fieldValues},
      pkgAmount: pkg.amount, price: pkg.price,
      receiptCode: receipt, contactTg: contact,
      status: 'kutilmoqda', createdAt: Date.now()
    };
    state.orders.push(order);
    await saveOrders(state.orders);
    setView('order-detail', {lastOrderId: order.orderId, selectedPkg:null, currentGame:null, fieldValues:{}});
    toast("Buyurtma qabul qilindi! ID: " + order.orderId);
  };

  const trackBtn = document.getElementById('trackBtn');
  if(trackBtn) trackBtn.onclick = ()=>{
    const id = document.getElementById('trackId').value.trim().toUpperCase();
    const found = state.orders.find(o=>o.orderId===id);
    const resultDiv = document.getElementById('trackResult');
    if(found){ setView('order-detail', {lastOrderId:id}); }
    else { resultDiv.innerHTML = `<div class="empty"><div class="icon">🔍</div>Buyurtma topilmadi</div>`; }
  };

  const adminLoginBtn = document.getElementById('adminLoginBtn');
  if(adminLoginBtn) adminLoginBtn.onclick = ()=>{
    const pass = document.getElementById('adminPass').value;
    if(pass === ADMIN_PASSWORD){ state.isAdmin = true; setView('admin'); }
    else toast("Parol noto'g'ri");
  };

  const adminLogout = document.getElementById('adminLogout');
  if(adminLogout) adminLogout.onclick = ()=>{ state.isAdmin = false; setView('home'); };

  document.querySelectorAll('.statusSelect').forEach(el=>{
    el.onchange = async ()=>{
      const o = state.orders.find(x=>x.orderId===el.dataset.order);
      if(o){ o.status = el.value; await saveOrders(state.orders); toast("Holat yangilandi"); render(); }
    };
  });

  document.querySelectorAll('.addPkgBtn').forEach(el=>{
    el.onclick = async ()=>{
      const amount = prompt("Paket miqdori (masalan: 500 Diamond):");
      if(!amount) return;
      const price = prompt("Narxi (so'mda, faqat raqam):");
      if(!price || isNaN(price)) return;
      const g = state.games.find(x=>x.id===el.dataset.game);
      g.packages.push({id:'p'+Date.now(), amount, price:parseInt(price)});
      await saveGames(state.games);
      render();
    };
  });

  document.querySelectorAll('.delPkgBtn').forEach(el=>{
    el.onclick = async ()=>{
      const g = state.games.find(x=>x.id===el.dataset.game);
      g.packages = g.packages.filter(p=>p.id!==el.dataset.pkg);
      await saveGames(state.games);
      render();
    };
  });
}

init();
</script>
</body>
</html>
